# The code gates of tools/check_gates.R: function length, export formals,
# masking, UK spelling, app size, base graphics, page coverage, tarball
# size and example time.
on:
  push:
    branches: [main, master]
  pull_request:

name: gates.yaml

permissions: read-all

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: https://ocean-tracking-network.r-universe.dev
      - uses: r-lib/actions/setup-r-dependencies@v2
      - name: Code gates
        # The page-coverage gate reads the sites of the whole suite, so it
        # cannot run on a checkout of one package; check_gates.R reports it
        # as not run.
        env:
          POSITIONR_LONE_CHECKOUT: "1"
        run: Rscript tools/check_gates.R .
